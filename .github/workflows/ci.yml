name: Python CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify MCP server import
        run: python -c "from facetide.server import mcp; print(mcp.name)"
